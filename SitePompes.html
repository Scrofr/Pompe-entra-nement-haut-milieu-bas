<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POMPE — Tirage aléatoire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3Cpath d='M50 18 L82 60 L62 60 L62 86 L38 86 L38 60 L18 60 Z' fill='%23f2f2f2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f2f2;
    --fg: #111111;
    --border: 4px;
  }
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- HEADER ---------- */
  header {
    flex-shrink: 0;
    border-bottom: var(--border) solid var(--fg);
    padding: clamp(8px, 1.2vh, 14px) clamp(12px, 2vw, 20px);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 {
    font-size: clamp(14px, 1.6vmin + 6px, 20px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 700;
  }
  #status {
    font-size: clamp(10px, 1vmin + 4px, 13px);
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* ---------- MAIN ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vh, 14px);
    padding: clamp(8px, 1.2vh, 14px) clamp(12px, 2vw, 20px);
    min-height: 0;
  }

  /* ---------- MODES ---------- */
  .modes {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: var(--border) solid var(--fg);
  }
  .mode {
    font-family: inherit;
    font-weight: 700;
    padding: clamp(8px, 1.6vh, 16px) clamp(2px, 0.8vw, 8px);
    border: none;
    border-right: var(--border) solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    border-radius: 0;
    appearance: none;
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    line-height: 1;
    min-width: 0;
    overflow: hidden;
  }
  .mode:last-child { border-right: none; }
  .mode.active {
    background: var(--fg);
    color: var(--bg);
  }
  .mode:active { transform: translate(2px, 2px); }
  .mode:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }

  .mode-name {
    font-size: clamp(10px, 2.5vw, 16px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .mode-interval {
    font-size: clamp(8px, 1.8vw, 11px);
    font-weight: 400;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    opacity: 0.7;
    white-space: nowrap;
  }
  .mode.active .mode-interval { opacity: 0.85; }

  /* ---------- CONTROLS ---------- */
  .controls {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 1.2vh, 14px);
  }
  .controls button {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(16px, 3.2vmin, 30px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: clamp(14px, 2.2vh, 26px) 8px;
    border: var(--border) solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    border-radius: 0;
    appearance: none;
    user-select: none;
    min-height: 48px;
  }
  .controls button:hover:not(:disabled) {
    background: var(--fg);
    color: var(--bg);
  }
  .controls button:active:not(:disabled) { transform: translate(3px, 3px); }
  .controls button:focus-visible { outline: var(--border) solid var(--fg); outline-offset: 4px; }
  .controls button:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ---------- TIMERS ---------- */
  .timers {
    flex: 1.4;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(8px, 1.2vw, 14px);
  }
  .timer-item {
    border: var(--border) solid var(--fg);
    padding: clamp(8px, 1.2vh, 16px) clamp(10px, 1.5vw, 18px);
    display: flex;
    flex-direction: column;
    gap: clamp(2px, 0.4vh, 6px);
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container-type: size;
  }
  .timer-label {
    flex-shrink: 0;
    font-size: clamp(9px, 1.4vmin + 2px, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .timer-value {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1;
    white-space: nowrap;
    font-size: clamp(28px, 8vmin, 100px); /* fallback */
    font-size: min(21cqw, 68cqh);
  }

  /* ---------- POSITION ---------- */
  #display {
    flex: 1;
    min-height: 0;
    border: var(--border) solid var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 clamp(8px, 1.5vw, 18px);
    overflow: hidden;
    container-type: size;
  }
  #displayText {
    display: block;
    max-width: 100%;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
    text-transform: uppercase;
    word-break: break-word;
    font-size: clamp(32px, 10vmin, 120px); /* fallback */
    font-size: min(24cqw, 65cqh);
  }
  #display.instruction #displayText {
    letter-spacing: 0.08em;
    line-height: 1.25;
    font-size: clamp(16px, 4.5vmin, 44px); /* fallback */
    font-size: min(10cqw, 16cqh);
  }

  /* ---------- FOOTER ---------- */
  footer {
    flex-shrink: 0;
    border-top: var(--border) solid var(--fg);
    padding: clamp(6px, 1vh, 10px) clamp(12px, 2vw, 20px);
    padding-bottom: max(clamp(6px, 1vh, 10px), env(safe-area-inset-bottom));
    font-size: clamp(9px, 1vmin + 3px, 11px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 400px) {
    .mode-name { font-size: 10px; }
    .mode-interval { font-size: 8px; }
  }
  @media (max-height: 560px) {
    footer { display: none; }
    header { padding-top: 4px; padding-bottom: 4px; }
  }
</style>
</head>
<body>

  <header>
    <h1>Pompe</h1>
    <span id="status">Prêt</span>
  </header>

  <main>
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" class="mode" data-mode="rapide" aria-label="Rapide, 3 à 7 secondes">
        <span class="mode-name">Rapide</span>
        <span class="mode-interval">3–7 s</span>
      </button>
      <button type="button" class="mode active" data-mode="normal" aria-label="Normal, 5 à 10 secondes">
        <span class="mode-name">Normal</span>
        <span class="mode-interval">5–10 s</span>
      </button>
      <button type="button" class="mode" data-mode="long" aria-label="Long, 5 à 15 secondes">
        <span class="mode-name">Long</span>
        <span class="mode-interval">5–15 s</span>
      </button>
      <button type="button" class="mode" data-mode="endurant" aria-label="Endurant, 15 secondes fixes">
        <span class="mode-name">Endurant</span>
        <span class="mode-interval">15 s</span>
      </button>
    </div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
    </div>

    <div class="timers">
      <div class="timer-item">
        <span class="timer-label">Prochaine</span>
        <span id="countdown" class="timer-value">—</span>
      </div>
      <div class="timer-item">
        <span class="timer-label">Total</span>
        <span id="total" class="timer-value">00:00.0</span>
      </div>
    </div>

    <div id="display" aria-live="polite"><span id="displayText">—</span></div>
  </main>

  <footer>Démarrage 5 s · Son par position · Échap : stop</footer>

<script>
(function () {
  'use strict';

  /* =========================================================
     CONFIG
     ========================================================= */
  var POSITIONS = ['HAUT', 'MILIEU', 'BAS'];
  var DELAI_INITIAL = 5000;

  var MODES = {
    rapide:   { min: 3000,  max: 7000  },
    normal:   { min: 5000,  max: 10000 },
    long:     { min: 5000,  max: 15000 },
    endurant: { min: 15000, max: 15000 }
  };
  var currentMode = 'normal';

  /* =========================================================
     DOM
     ========================================================= */
  var display     = document.getElementById('display');
  var displayText = document.getElementById('displayText');
  var statusEl    = document.getElementById('status');
  var countdownEl = document.getElementById('countdown');
  var totalEl     = document.getElementById('total');
  var startBtn    = document.getElementById('start');
  var pauseBtn    = document.getElementById('pause');
  var modeButtons = document.querySelectorAll('.mode');

  /* =========================================================
     ÉTAT
     ========================================================= */
  var state = 'idle';           // 'idle' | 'running' | 'paused'
  var totalAccumule = 0;
  var debutSegment = 0;
  var delaiRestant = 0;
  var prochainTirage = 0;
  var drawTimer = null;
  var tickInterval = null;
  var compteur = 0;
  var dernierePosition = null;

  /* =========================================================
     AUDIO — sons par position
     ========================================================= */
  var audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      } catch (e) {
        return;
      }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function playBeep(freq, startOffset, duration) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    var t0 = audioCtx.currentTime + startOffset;
    var t1 = t0 + duration;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.18, t0 + 0.006);
    gain.gain.linearRampToValueAtTime(0.18, t1 - 0.006);
    gain.gain.linearRampToValueAtTime(0.0001, t1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t1 + 0.03);
  }

  function playPositionSound(position) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(function () {
        playPositionSound(position);
      }).catch(function () {});
      return;
    }
    if (position === 'HAUT') {
      playBeep(880, 0,    0.10);
      playBeep(880, 0.16, 0.10);
    } else if (position === 'MILIEU') {
      playBeep(660, 0, 0.22);
    } else if (position === 'BAS') {
      playBeep(440, 0, 0.48);
    }
  }

  /* =========================================================
     UTILITAIRES
     ========================================================= */
  function randomDelay() {
    var m = MODES[currentMode] || MODES.normal;
    if (m.max <= m.min) return m.min;
    return m.min + Math.random() * (m.max - m.min);
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function formatTotal(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var dec = Math.floor((ms % 1000) / 100);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return pad2(m) + ':' + pad2(s) + '.' + dec;
  }

  function formatCountdown(ms) {
    if (ms < 0) ms = 0;
    return (ms / 1000).toFixed(1) + ' s';
  }

  function getTotalMs() {
    if (state === 'running') return totalAccumule + (performance.now() - debutSegment);
    return totalAccumule;
  }

  function getCountdownMs() {
    if (state === 'running') return Math.max(0, prochainTirage - performance.now());
    return delaiRestant;
  }

  function updateTimers() {
    countdownEl.textContent = formatCountdown(getCountdownMs());
    totalEl.textContent = formatTotal(getTotalMs());
  }

  function startTick() {
    stopTick();
    tickInterval = window.setInterval(updateTimers, 50);
    updateTimers();
  }
  function stopTick() {
    if (tickInterval !== null) {
      window.clearInterval(tickInterval);
      tickInterval = null;
    }
  }
  function clearDraw() {
    if (drawTimer !== null) {
      window.clearTimeout(drawTimer);
      drawTimer = null;
    }
  }
  function scheduleDraw(delay) {
    clearDraw();
    drawTimer = window.setTimeout(onDraw, delay);
  }
  function setStatus(txt) { statusEl.textContent = txt; }

  function afficher(texte, mode) {
    displayText.textContent = texte;
    display.classList.toggle('instruction', mode === 'instruction');
  }

  /* =========================================================
     SÉLECTION SANS RÉPÉTITION
     ========================================================= */
  function pickPosition() {
    var choices;
    if (dernierePosition === null) {
      choices = POSITIONS;
    } else {
      choices = POSITIONS.filter(function (p) { return p !== dernierePosition; });
    }
    var pos = choices[Math.floor(Math.random() * choices.length)];
    dernierePosition = pos;
    return pos;
  }

  /* =========================================================
     CYCLE
     ========================================================= */
  function onDraw() {
    drawTimer = null;
    var position = pickPosition();
    afficher(position, 'position');
    compteur++;
    setStatus('En cours · ' + compteur);
    playPositionSound(position);

    if (state === 'running') {
      delaiRestant = randomDelay();
      prochainTirage = performance.now() + delaiRestant;
      scheduleDraw(delaiRestant);
    }
  }

  /* =========================================================
     CONTRÔLES
     ========================================================= */
  function start() {
    if (state !== 'idle') return;
    initAudio();
    state = 'running';
    totalAccumule = 0;
    debutSegment = performance.now();
    compteur = 0;
    dernierePosition = 'HAUT';
    delaiRestant = DELAI_INITIAL;
    prochainTirage = performance.now() + delaiRestant;
    afficher('METTEZ-VOUS EN POSITION HAUTE', 'instruction');
    setStatus('Préparation');
    playPositionSound('HAUT');
    scheduleDraw(delaiRestant);
    startTick();
    updateButtons();
  }

  function pause() {
    if (state !== 'running') return;
    var now = performance.now();
    totalAccumule += now - debutSegment;
    delaiRestant = Math.max(0, prochainTirage - now);
    state = 'paused';
    clearDraw();
    stopTick();
    updateTimers();
    setStatus('Pause · ' + compteur);
    updateButtons();
  }

  function resume() {
    if (state !== 'paused') return;
    initAudio();
    state = 'running';
    debutSegment = performance.now();
    prochainTirage = performance.now() + delaiRestant;
    scheduleDraw(delaiRestant);
    startTick();
    setStatus(compteur === 0 ? 'Préparation' : 'En cours · ' + compteur);
    updateButtons();
  }

  function stop() {
    if (state === 'idle') return;
    clearDraw();
    stopTick();
    state = 'idle';
    totalAccumule = 0;
    debutSegment = 0;
    delaiRestant = 0;
    prochainTirage = 0;
    compteur = 0;
    dernierePosition = null;
    afficher('—', 'position');
    countdownEl.textContent = '—';
    totalEl.textContent = '00:00.0';
    setStatus('Prêt');
    updateButtons();
  }

  function updateButtons() {
    if (state === 'idle') {
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      pauseBtn.disabled = true;
    } else if (state === 'running') {
      startBtn.textContent = 'Stop';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      pauseBtn.disabled = false;
    } else {
      startBtn.textContent = 'Stop';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Reprendre';
      pauseBtn.disabled = false;
    }
  }

  /* =========================================================
     ÉCOUTEURS
     ========================================================= */
  startBtn.addEventListener('click', function () {
    if (state === 'idle') start();
    else stop();
  });

  pauseBtn.addEventListener('click', function () {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
  });

  modeButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var m = btn.dataset.mode;
      if (!MODES[m]) return;
      currentMode = m;
      modeButtons.forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.target === startBtn || e.target === pauseBtn) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'idle') start();
      else if (state === 'running') pause();
      else if (state === 'paused') resume();
    } else if (e.code === 'Escape') {
      e.preventDefault();
      if (state !== 'idle') stop();
    }
  });

  /* =========================================================
     INIT
     ========================================================= */
  afficher('—', 'position');
  setStatus('Prêt');
  updateButtons();
  updateTimers();
})();
</script>

</body>
</html>
