<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POMPE — Tirage aléatoire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3Cpath d='M50 18 L82 60 L62 60 L62 86 L38 86 L38 60 L18 60 Z' fill='%23f2f2f2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f2f2f2;
    --fg: #111111;
  }
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- HEADER ---------- */
  header {
    border-bottom: 4px solid var(--fg);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
  }
  h1 {
    font-size: 18px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 700;
  }
  #status {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* ---------- MAIN ---------- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
  }

  /* ---------- MODES ---------- */
  .modes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 4px solid var(--fg);
  }
  .mode {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(10px, 1.7vw, 14px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px 4px;
    border: none;
    border-right: 4px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    border-radius: 0;
    appearance: none;
    user-select: none;
  }
  .mode:last-child { border-right: none; }
  .mode.active {
    background: var(--fg);
    color: var(--bg);
  }
  .mode:active { transform: translate(2px, 2px); }
  .mode:focus-visible { outline: 3px solid var(--fg); outline-offset: -3px; }

  /* ---------- CONTROLS ---------- */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .controls button {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(16px, 3vw, 26px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 22px 10px;
    border: 4px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    border-radius: 0;
    appearance: none;
    user-select: none;
  }
  .controls button:hover:not(:disabled) {
    background: var(--fg);
    color: var(--bg);
  }
  .controls button:active:not(:disabled) { transform: translate(3px, 3px); }
  .controls button:focus-visible { outline: 4px solid var(--fg); outline-offset: 4px; }
  .controls button:disabled { opacity: 0.25; cursor: not-allowed; }

  /* ---------- TIMERS ---------- */
  .timers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .timer-item {
    border: 4px solid var(--fg);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .timer-label {
    font-size: clamp(10px, 1.6vw, 13px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .timer-value {
    font-size: clamp(26px, 9vw, 80px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    line-height: 1;
    white-space: nowrap;
  }

  /* ---------- POSITION ---------- */
  #display {
    border: 4px solid var(--fg);
    height: clamp(130px, 20vh, 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 16px;
    overflow: hidden;
    font-size: clamp(36px, 14vw, 160px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
    word-break: break-word;
  }
  #display.waiting {
    font-size: clamp(22px, 6vw, 52px);
    letter-spacing: 0.4em;
  }
  #display.instruction {
    font-size: clamp(18px, 3.8vw, 38px);
    letter-spacing: 0.1em;
    line-height: 1.25;
  }

  /* ---------- FOOTER ---------- */
  footer {
    border-top: 4px solid var(--fg);
    padding: 10px 18px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 520px) {
    main { padding: 12px; gap: 12px; }
    .controls { gap: 12px; }
    .controls button { padding: 18px 8px; }
    .timers { gap: 10px; }
    .timer-item { padding: 10px 12px; }
    .mode { padding: 12px 2px; font-size: 10px; }
    header { padding: 12px 14px; }
  }
</style>
</head>
<body>

  <header>
    <h1>Pompe</h1>
    <span id="status">Prêt</span>
  </header>

  <main>
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" class="mode" data-mode="facile">Facile</button>
      <button type="button" class="mode active" data-mode="normal">Normal</button>
      <button type="button" class="mode" data-mode="difficile">Difficile</button>
      <button type="button" class="mode" data-mode="extreme">Extrême</button>
    </div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
    </div>

    <div class="timers">
      <div class="timer-item">
        <span class="timer-label">Prochaine</span>
        <span id="countdown" class="timer-value">—</span>
      </div>
      <div class="timer-item">
        <span class="timer-label">Total</span>
        <span id="total" class="timer-value">00:00.0</span>
      </div>
    </div>

    <div id="display" aria-live="polite">—</div>
  </main>

  <footer>Démarrage 5 s · Son par position · Échap : stop</footer>

<script>
(function () {
  'use strict';

  /* =========================================================
     CONFIG
     ========================================================= */
  var POSITIONS = ['HAUT', 'MILIEU', 'BAS'];
  var DELAI_INITIAL = 5000;

  var MODES = {
    facile:    { min: 3000,  max: 7000  },
    normal:    { min: 5000,  max: 10000 },
    difficile: { min: 5000,  max: 15000 },
    extreme:   { min: 15000, max: 15000 }
  };
  var currentMode = 'normal';

  /* =========================================================
     DOM
     ========================================================= */
  var display     = document.getElementById('display');
  var statusEl    = document.getElementById('status');
  var countdownEl = document.getElementById('countdown');
  var totalEl     = document.getElementById('total');
  var startBtn    = document.getElementById('start');
  var pauseBtn    = document.getElementById('pause');
  var modeButtons = document.querySelectorAll('.mode');

  /* =========================================================
     ÉTAT
     ========================================================= */
  var state = 'idle';           // 'idle' | 'running' | 'paused'
  var totalAccumule = 0;
  var debutSegment = 0;
  var delaiRestant = 0;
  var prochainTirage = 0;
  var drawTimer = null;
  var tickInterval = null;
  var compteur = 0;
  var dernierePosition = null;

  /* =========================================================
     AUDIO (Web Audio API) — sons par position
     ========================================================= */
  var audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      } catch (e) {
        return;
      }
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function playBeep(freq, startOffset, duration) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    var t0 = audioCtx.currentTime + startOffset;
    var t1 = t0 + duration;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(0.18, t0 + 0.006);
    gain.gain.linearRampToValueAtTime(0.18, t1 - 0.006);
    gain.gain.linearRampToValueAtTime(0.0001, t1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t1 + 0.03);
  }

  // HAUT   : deux bips aigus courts
  // MILIEU : un bip médium
  // BAS    : un bip grave long
  function playPositionSound(position) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(function () {
        playPositionSound(position);
      }).catch(function () {});
      return;
    }
    if (position === 'HAUT') {
      playBeep(880, 0,    0.10);
      playBeep(880, 0.16, 0.10);
    } else if (position === 'MILIEU') {
      playBeep(660, 0, 0.22);
    } else if (position === 'BAS') {
      playBeep(440, 0, 0.48);
    }
  }

  /* =========================================================
     UTILITAIRES
     ========================================================= */
  function randomDelay() {
    var m = MODES[currentMode] || MODES.normal;
    if (m.max <= m.min) return m.min;
    return m.min + Math.random() * (m.max - m.min);
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function formatTotal(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var dec = Math.floor((ms % 1000) / 100);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return pad2(m) + ':' + pad2(s) + '.' + dec;
  }

  function formatCountdown(ms) {
    if (ms < 0) ms = 0;
    return (ms / 1000).toFixed(1) + ' s';
  }

  function getTotalMs() {
    if (state === 'running') return totalAccumule + (performance.now() - debutSegment);
    return totalAccumule;
  }

  function getCountdownMs() {
    if (state === 'running') return Math.max(0, prochainTirage - performance.now());
    return delaiRestant;
  }

  function updateTimers() {
    countdownEl.textContent = formatCountdown(getCountdownMs());
    totalEl.textContent = formatTotal(getTotalMs());
  }

  function startTick() {
    stopTick();
    tickInterval = window.setInterval(updateTimers, 50);
    updateTimers();
  }
  function stopTick() {
    if (tickInterval !== null) {
      window.clearInterval(tickInterval);
      tickInterval = null;
    }
  }
  function clearDraw() {
    if (drawTimer !== null) {
      window.clearTimeout(drawTimer);
      drawTimer = null;
    }
  }
  function scheduleDraw(delay) {
    clearDraw();
    drawTimer = window.setTimeout(onDraw, delay);
  }
  function setStatus(txt) { statusEl.textContent = txt; }

  function afficher(texte, mode) {
    display.textContent = texte;
    display.classList.remove('waiting', 'instruction');
    if (mode === 'waiting') {
      display.classList.add('waiting');
    } else if (mode === 'instruction') {
      display.classList.add('instruction');
    }
  }

  /* =========================================================
     SÉLECTION SANS RÉPÉTITION
     ========================================================= */
  function pickPosition() {
    var choices;
    if (dernierePosition === null) {
      choices = POSITIONS;
    } else {
      choices = POSITIONS.filter(function (p) { return p !== dernierePosition; });
    }
    var pos = choices[Math.floor(Math.random() * choices.length)];
    dernierePosition = pos;
    return pos;
  }

  /* =========================================================
     CYCLE
     ========================================================= */
  function onDraw() {
    drawTimer = null;
    var position = pickPosition();
    afficher(position, 'position');
    compteur++;
    setStatus('En cours · ' + compteur);
    playPositionSound(position);

    if (state === 'running') {
      delaiRestant = randomDelay();
      prochainTirage = performance.now() + delaiRestant;
      scheduleDraw(delaiRestant);
    }
  }

  /* =========================================================
     CONTRÔLES
     ========================================================= */
  function start() {
    if (state !== 'idle') return;
    initAudio();
    state = 'running';
    totalAccumule = 0;
    debutSegment = performance.now();
    compteur = 0;
    dernierePosition = 'HAUT'; // l'utilisateur se met en HAUT
    delaiRestant = DELAI_INITIAL;
    prochainTirage = performance.now() + delaiRestant;
    afficher('METTEZ-VOUS EN POSITION HAUTE', 'instruction');
    setStatus('Préparation');
    playPositionSound('HAUT');
    scheduleDraw(delaiRestant);
    startTick();
    updateButtons();
  }

  function pause() {
    if (state !== 'running') return;
    var now = performance.now();
    totalAccumule += now - debutSegment;
    delaiRestant = Math.max(0, prochainTirage - now);
    state = 'paused';
    clearDraw();
    stopTick();
    updateTimers();
    setStatus('Pause · ' + compteur);
    updateButtons();
  }

  function resume() {
    if (state !== 'paused') return;
    initAudio();
    state = 'running';
    debutSegment = performance.now();
    prochainTirage = performance.now() + delaiRestant;
    scheduleDraw(delaiRestant);
    startTick();
    setStatus(compteur === 0 ? 'Préparation' : 'En cours · ' + compteur);
    updateButtons();
  }

  function stop() {
    if (state === 'idle') return;
    clearDraw();
    stopTick();
    state = 'idle';
    totalAccumule = 0;
    debutSegment = 0;
    delaiRestant = 0;
    prochainTirage = 0;
    compteur = 0;
    dernierePosition = null;
    afficher('—', 'waiting');
    countdownEl.textContent = '—';
    totalEl.textContent = '00:00.0';
    setStatus('Prêt');
    updateButtons();
  }

  function updateButtons() {
    if (state === 'idle') {
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      pauseBtn.disabled = true;
    } else if (state === 'running') {
      startBtn.textContent = 'Stop';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      pauseBtn.disabled = false;
    } else {
      startBtn.textContent = 'Stop';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Reprendre';
      pauseBtn.disabled = false;
    }
  }

  /* =========================================================
     ÉCOUTEURS
     ========================================================= */
  startBtn.addEventListener('click', function () {
    if (state === 'idle') start();
    else stop();
  });

  pauseBtn.addEventListener('click', function () {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
  });

  modeButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var m = btn.dataset.mode;
      if (!MODES[m]) return;
      currentMode = m;
      modeButtons.forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      // Le mode s'applique au prochain tirage (le décompte en cours continue)
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.target === startBtn || e.target === pauseBtn) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'idle') start();
      else if (state === 'running') pause();
      else if (state === 'paused') resume();
    } else if (e.code === 'Escape') {
      e.preventDefault();
      if (state !== 'idle') stop();
    }
  });

  /* =========================================================
     INIT
     ========================================================= */
  afficher('—', 'waiting');
  setStatus('Prêt');
  updateButtons();
  updateTimers();
})();
</script>

</body>
</html>
