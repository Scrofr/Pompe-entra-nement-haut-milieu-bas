<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POMPE — Tirage aléatoire</title>
<style>
  :root{
    --bg: #f2f2f2;
    --fg: #111111;
  }

  *,
  *::before,
  *::after{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body{
    height: 100%;
  }

  body{
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: none;
  }

  header{
    border-bottom: 4px solid var(--fg);
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }

  h1{
    font-size: 18px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 700;
  }

  #status{
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
  }

  #display{
    flex: 1;
    min-height: 240px;
    border: 4px solid var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
    font-size: clamp(36px, 14vw, 160px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
    word-break: break-word;
  }

  #display.waiting{
    font-size: clamp(22px, 6vw, 52px);
    letter-spacing: 0.4em;
  }

  .controls{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  button{
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(16px, 3vw, 28px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 30px 12px;
    border: 4px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    border-radius: 0;
    appearance: none;
  }

  button:hover:not(:disabled){
    background: var(--fg);
    color: var(--bg);
  }

  button:active:not(:disabled){
    transform: translate(3px, 3px);
  }

  button:focus-visible{
    outline: 4px solid var(--fg);
    outline-offset: 4px;
  }

  button:disabled{
    opacity: 0.25;
    cursor: not-allowed;
  }

  footer{
    border-top: 4px solid var(--fg);
    padding: 12px 20px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  @media (max-width: 520px){
    .controls{
      grid-template-columns: 1fr;
    }
    main{
      padding: 14px;
      gap: 14px;
    }
    .controls{
      gap: 14px;
    }
  }
</style>
</head>
<body>

  <header>
    <h1>Pompe</h1>
    <span id="status">Prêt</span>
  </header>

  <main>
    <div id="display" aria-live="polite">—</div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
    </div>
  </main>

  <footer>Temps aléatoire : 1 à 10 secondes</footer>

<script>
(function () {
  'use strict';

  var POSITIONS = ['HAUT', 'MILIEU', 'BAS'];
  var DELAI_MIN = 1000;
  var DELAI_MAX = 10000;

  var display = document.getElementById('display');
  var statusEl = document.getElementById('status');
  var startBtn = document.getElementById('start');
  var pauseBtn = document.getElementById('pause');

  var timerId = null;
  var enCours = false;

  function setStatus(txt) {
    statusEl.textContent = txt;
  }

  function afficher(texte, attente) {
    display.textContent = texte;
    if (attente) {
      display.classList.add('waiting');
    } else {
      display.classList.remove('waiting');
    }
  }

  function demarrer() {
    if (enCours) {
      return;
    }

    enCours = true;
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    setStatus('En attente');
    afficher('...', true);

    var delai = DELAI_MIN + Math.random() * (DELAI_MAX - DELAI_MIN);

    timerId = window.setTimeout(function () {
      timerId = null;
      enCours = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;

      var position = POSITIONS[Math.floor(Math.random() * POSITIONS.length)];
      afficher(position, false);
      setStatus('Position');
    }, delai);
  }

  function arreter() {
    if (!enCours) {
      return;
    }

    if (timerId !== null) {
      window.clearTimeout(timerId);
      timerId = null;
    }

    enCours = false;
    startBtn.disabled = false;
    pauseBtn.disabled = true;
    afficher('Arrêt', false);
    setStatus('Arrêté');
  }

  startBtn.addEventListener('click', demarrer);
  pauseBtn.addEventListener('click', arreter);

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (e.target === startBtn || e.target === pauseBtn) {
        return;
      }
      e.preventDefault();
      demarrer();
    } else if (e.code === 'Escape') {
      e.preventDefault();
      arreter();
    }
  });

  afficher('—', false);
  setStatus('Prêt');
})();
</script>

</body>
</html>
