<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POSITION POMPE</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #111;
    color: #eee;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 4px solid #eee;
    padding: 0.75rem 1.5rem;
    margin-bottom: 3rem;
    background: #000;
  }

  .display {
    width: 100%;
    max-width: 420px;
    border: 6px solid #eee;
    background: #000;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
    position: relative;
  }

  .display::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 8px;
    right: 8px;
    bottom: 8px;
    border: 2px solid #333;
    pointer-events: none;
  }

  #position {
    font-size: 3.2rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.1;
  }

  #position.waiting {
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    color: #666;
  }

  .controls {
    display: flex;
    gap: 1rem;
    width: 100%;
    max-width: 420px;
  }

  button {
    flex: 1;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 1.1rem 0;
    border: 4px solid #eee;
    background: #111;
    color: #eee;
    cursor: pointer;
    transition: none;
  }

  button:hover {
    background: #eee;
    color: #111;
  }

  button:active {
    background: #ccc;
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  button:disabled:hover {
    background: #111;
    color: #eee;
  }

  .status {
    margin-top: 2rem;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: #555;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <h1>POSITION POMPE</h1>

  <div class="display">
    <div id="position" class="waiting">—</div>
  </div>

  <div class="controls">
    <button id="btnStart">Start</button>
    <button id="btnPause" disabled>Pause</button>
  </div>

  <div class="status" id="status">Pret</div>

<script>
  const positions = ['HAUT', 'MILIEU', 'BAS'];
  const elPos = document.getElementById('position');
  const elStatus = document.getElementById('status');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');

  let timerId = null;
  let running = false;

  function randomDelay() {
    return Math.floor(Math.random() * 9000) + 1000; // 1000 à 10000 ms
  }

  function randomPosition() {
    return positions[Math.floor(Math.random() * positions.length)];
  }

  function scheduleNext() {
    if (!running) return;

    const delay = randomDelay();
    elStatus.textContent = 'Attente ' + (delay / 1000).toFixed(1) + 's';

    timerId = setTimeout(() => {
      if (!running) return;
      const pos = randomPosition();
      elPos.textContent = pos;
      elPos.classList.remove('waiting');
      scheduleNext();
    }, delay);
  }

  function start() {
    if (running) return;
    running = true;
    btnStart.disabled = true;
    btnPause.disabled = false;
    elStatus.textContent = 'En cours';
    scheduleNext();
  }

  function pause() {
    running = false;
    if (timerId) {
      clearTimeout(timerId);
      timerId = null;
    }
    btnStart.disabled = false;
    btnPause.disabled = true;
    elStatus.textContent = 'Pause';
  }

  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', pause);
</script>

</body>
</html>
