<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POMPE — Tirage aléatoire</title>
<style>
  :root {
    --bg: #f2f2f2;
    --fg: #111111;
  }
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: none;
  }
  header {
    border-bottom: 4px solid var(--fg);
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-size: 18px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 700;
  }
  #status {
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 20px;
  }
  #display {
    flex: 1;
    min-height: 200px;
    border: 4px solid var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    overflow: hidden;
    font-size: clamp(36px, 14vw, 160px);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
    word-break: break-word;
  }
  #display.waiting {
    font-size: clamp(22px, 6vw, 52px);
    letter-spacing: 0.4em;
  }
  #display.instruction {
    font-size: clamp(20px, 4.5vw, 44px);
    letter-spacing: 0.15em;
    line-height: 1.35;
  }
  #timerbar {
    border: 4px solid var(--fg);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .timer-item {
    padding: 12px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .timer-item + .timer-item {
    border-left: 4px solid var(--fg);
  }
  .timer-label {
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }
  .timer-value {
    font-size: clamp(22px, 5vw, 40px);
    font-weight: 700;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(16px, 3vw, 28px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 30px 12px;
    border: 4px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    border-radius: 0;
    appearance: none;
  }
  button:hover:not(:disabled) {
    background: var(--fg);
    color: var(--bg);
  }
  button:active:not(:disabled) {
    transform: translate(3px, 3px);
  }
  button:focus-visible {
    outline: 4px solid var(--fg);
    outline-offset: 4px;
  }
  button:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }
  footer {
    border-top: 4px solid var(--fg);
    padding: 12px 20px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  @media (max-width: 520px) {
    .controls { grid-template-columns: 1fr; }
    main { padding: 14px; gap: 14px; }
    .controls { gap: 14px; }
    .timer-item { padding: 10px 14px; }
  }
</style>
</head>
<body>

  <header>
    <h1>Pompe</h1>
    <span id="status">Prêt</span>
  </header>

  <main>
    <div id="display" aria-live="polite">—</div>

    <div id="timerbar">
      <div class="timer-item">
        <span class="timer-label">Prochaine</span>
        <span id="countdown" class="timer-value">—</span>
      </div>
      <div class="timer-item">
        <span class="timer-label">Total</span>
        <span id="total" class="timer-value">00:00.0</span>
      </div>
    </div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button" disabled>Pause</button>
    </div>
  </main>

  <footer>Démarrage 5 s · Intervalle 5–15 s · Espace : pause/reprendre · Échap : stop</footer>

<script>
(function () {
  'use strict';

  var POSITIONS = ['HAUT', 'MILIEU', 'BAS'];
  var DELAI_MIN = 5000;
  var DELAI_MAX = 15000;
  var DELAI_INITIAL = 5000;

  var display = document.getElementById('display');
  var statusEl = document.getElementById('status');
  var countdownEl = document.getElementById('countdown');
  var totalEl = document.getElementById('total');
  var startBtn = document.getElementById('start');
  var pauseBtn = document.getElementById('pause');

  var state = 'idle';          // 'idle' | 'running' | 'paused'
  var totalAccumule = 0;
  var debutSegment = 0;
  var delaiRestant = 0;
  var prochainTirage = 0;
  var drawTimer = null;
  var tickInterval = null;
  var compteur = 0;
  var dernierePosition = null;

  // ---------- Utilitaires ----------

  function randomDelay() {
    return DELAI_MIN + Math.random() * (DELAI_MAX - DELAI_MIN);
  }

  function pad2(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function formatTotal(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var dec = Math.floor((ms % 1000) / 100);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return pad2(m) + ':' + pad2(s) + '.' + dec;
  }

  function formatCountdown(ms) {
    if (ms < 0) ms = 0;
    return (ms / 1000).toFixed(2) + ' s';
  }

  function getTotalMs() {
    if (state === 'running') {
      return totalAccumule + (performance.now() - debutSegment);
    }
    return totalAccumule;
  }

  function getCountdownMs() {
    if (state === 'running') {
      return Math.max(0, prochainTirage - performance.now());
    }
    return delaiRestant;
  }

  function updateTimers() {
    countdownEl.textContent = formatCountdown(getCountdownMs());
    totalEl.textContent = formatTotal(getTotalMs());
  }

  function startTick() {
    stopTick();
    tickInterval = window.setInterval(updateTimers, 40);
    updateTimers();
  }

  function stopTick() {
    if (tickInterval !== null) {
      window.clearInterval(tickInterval);
      tickInterval = null;
    }
  }

  function clearDraw() {
    if (drawTimer !== null) {
      window.clearTimeout(drawTimer);
      drawTimer = null;
    }
  }

  function scheduleDraw(delay) {
    clearDraw();
    drawTimer = window.setTimeout(onDraw, delay);
  }

  function setStatus(txt) {
    statusEl.textContent = txt;
  }

  function afficher(texte, mode) {
    display.textContent = texte;
    display.classList.remove('waiting', 'instruction');
    if (mode === 'waiting') {
      display.classList.add('waiting');
    } else if (mode === 'instruction') {
      display.classList.add('instruction');
    }
  }

  // ---------- Sélection sans répétition ----------

  function pickPosition() {
    var choices;
    if (dernierePosition === null) {
      choices = POSITIONS;
    } else {
      choices = POSITIONS.filter(function (p) {
        return p !== dernierePosition;
      });
    }
    var pos = choices[Math.floor(Math.random() * choices.length)];
    dernierePosition = pos;
    return pos;
  }

  // ---------- Cycle de tirage ----------

  function onDraw() {
    drawTimer = null;

    var position = pickPosition();
    afficher(position, 'position');
    compteur++;
    setStatus('En cours · ' + compteur);

    if (state === 'running') {
      delaiRestant = randomDelay();
      prochainTirage = performance.now() + delaiRestant;
      scheduleDraw(delaiRestant);
    }
  }

  // ---------- Contrôles ----------

  function start() {
    if (state !== 'idle') return;
    state = 'running';
    totalAccumule = 0;
    debutSegment = performance.now();
    compteur = 0;
    dernierePosition = null;
    delaiRestant = DELAI_INITIAL;
    prochainTirage = performance.now() + delaiRestant;
    afficher('METTEZ-VOUS EN POSITION HAUTE', 'instruction');
    setStatus('Préparation');
    scheduleDraw(delaiRestant);
    startTick();
    updateButtons();
  }

  function pause() {
    if (state !== 'running') return;
    var now = performance.now();
    totalAccumule += now - debutSegment;
    delaiRestant = Math.max(0, prochainTirage - now);
    state = 'paused';
    clearDraw();
    stopTick();
    updateTimers();
    setStatus('Pause · ' + compteur);
    updateButtons();
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'running';
    debutSegment = performance.now();
    prochainTirage = performance.now() + delaiRestant;
    scheduleDraw(delaiRestant);
    startTick();
    setStatus(compteur === 0 ? 'Préparation' : 'En cours · ' + compteur);
    updateButtons();
  }

  function stop() {
    if (state === 'idle') return;
    clearDraw();
    stopTick();
    state = 'idle';
    totalAccumule = 0;
    debutSegment = 0;
    delaiRestant = 0;
    prochainTirage = 0;
    compteur = 0;
    dernierePosition = null;
    afficher('—', 'waiting');
    countdownEl.textContent = '—';
    totalEl.textContent = '00:00.0';
    setStatus('Prêt');
    updateButtons();
  }

  function updateButtons() {
    if (state === 'idle') {
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      pauseBtn.disabled = true;
    } else if (state === 'running') {
      startBtn.textContent = 'Stop';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      pauseBtn.disabled = false;
    } else {
      startBtn.textContent = 'Stop';
      startBtn.disabled = false;
      pauseBtn.textContent = 'Reprendre';
      pauseBtn.disabled = false;
    }
  }

  // ---------- Écouteurs ----------

  startBtn.addEventListener('click', function () {
    if (state === 'idle') start();
    else stop();
  });

  pauseBtn.addEventListener('click', function () {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
  });

  document.addEventListener('keydown', function (e) {
    if (e.target === startBtn || e.target === pauseBtn) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (state === 'idle') start();
      else if (state === 'running') pause();
      else if (state === 'paused') resume();
    } else if (e.code === 'Escape') {
      e.preventDefault();
      if (state !== 'idle') stop();
    }
  });

  // ---------- Init ----------

  afficher('—', 'waiting');
  setStatus('Prêt');
  updateButtons();
  updateTimers();
})();
</script>

</body>
</html>
